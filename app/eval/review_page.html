<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>gdt review</title>
<style>
/* Drafting table: paper and graphite by day, blueprint by night. The red and
   blue here are the SAME red box and blue dot drawn on the crops, so the page's
   colour language is the drawing's. Everything is local: no fonts, no assets. */
:root {
  --paper: #f3efe4;
  --paper-2: #ebe5d6;
  --sheet: #fbf9f3;
  --ink: #1b2330;
  --ink-2: #4a5566;
  --ink-3: #7b8595;
  --rule: #cfc6b2;
  --grid: rgba(27, 35, 48, .045);
  --red: #c4372c;
  --red-soft: rgba(196, 55, 44, .12);
  --blue: #1f5fd6;
  --blue-soft: rgba(31, 95, 214, .12);
  --ok: #2f7d4f;
  --shadow: 0 1px 0 rgba(27,35,48,.06), 0 8px 24px -12px rgba(27,35,48,.25);
  --mono: "JetBrains Mono", "IBM Plex Mono", "Iosevka", "Cascadia Code",
          "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", "Source Sans 3", "Segoe UI Variable Text",
          "Cantarell", "Noto Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0d2440;
    --paper-2: #10294a;
    --sheet: #12305a;
    --ink: #e8f0ff;
    --ink-2: #b4c5e4;
    --ink-3: #7f95bb;
    --rule: #2b4c7c;
    --grid: rgba(180, 210, 255, .07);
    --red: #ff7a6b;
    --red-soft: rgba(255, 122, 107, .16);
    --blue: #7fb2ff;
    --blue-soft: rgba(127, 178, 255, .16);
    --ok: #6fd39a;
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 15px/1.5 var(--sans);
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 8px 8px, 8px 8px, 40px 40px, 40px 40px;
  min-height: 100vh;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---- title block ------------------------------------------------------- */
.titleblock {
  position: sticky; top: 0; z-index: 5;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: stretch;
  border-bottom: 2px solid var(--ink);
  background: var(--sheet);
  box-shadow: var(--shadow);
}
.titleblock > * { padding: 10px 16px; border-right: 1px solid var(--rule); }
.titleblock > *:last-child { border-right: 0; }
.tb-label { display: block; font: 10px/1 var(--mono); letter-spacing: .12em;
            text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
.tb-title { font: 600 18px/1.1 var(--mono); letter-spacing: -.01em; }
.tb-title small { font-weight: 400; color: var(--ink-3); }
.sheets { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.sheet-dot {
  min-width: 30px; height: 30px; padding: 0 6px;
  border: 1.5px solid var(--rule); background: transparent; cursor: pointer;
  font: 12px/1 var(--mono); color: var(--ink-2);
}
.sheet-dot.done { border-color: var(--ok); color: var(--ok); }
.sheet-dot.done::after { content: " ✓"; }
.sheet-dot.current { border-color: var(--ink); background: var(--ink);
                     color: var(--sheet); }
.status { font: 12px/1.3 var(--mono); color: var(--ink-2); min-width: 150px;
          display: flex; flex-direction: column; justify-content: center; }
.status.bad { color: var(--red); }
.status.good { color: var(--ok); }
.finish {
  align-self: center; margin: 0 14px; padding: 0 18px; height: 40px;
  border: 2px solid var(--ink); background: var(--ink); color: var(--sheet);
  font: 600 13px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  cursor: pointer;
}
.finish:hover { background: transparent; color: var(--ink); }

/* ---- row -------------------------------------------------------------- */
main { max-width: 1360px; margin: 0 auto; padding: 22px 20px 64px; }
.row { animation: settle .22s ease-out; }
@keyframes settle { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .row { animation: none; } }

.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px;
        margin-bottom: 14px; }
.meta .id { font: 600 26px/1 var(--mono); }
.meta .part { font: 14px/1.2 var(--mono); color: var(--ink-2); }
.badge { font: 600 11px/1 var(--mono); letter-spacing: .1em;
         text-transform: uppercase; padding: 5px 8px; border: 1.5px solid; }
.badge.silent { color: var(--red); border-color: var(--red);
                background: var(--red-soft); }
.badge.flagged { color: var(--ink-3); border-color: var(--rule); }

.figures { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
figure { margin: 0; background: var(--sheet); border: 1px solid var(--rule);
         box-shadow: var(--shadow); display: flex; flex-direction: column; }
figure .frame { position: relative; min-height: 220px; display: grid;
                place-items: center; background:
                  repeating-linear-gradient(45deg, transparent 0 10px,
                  var(--grid) 10px 20px); cursor: zoom-in; }
figure.zoomed { grid-column: 1 / -1; }
figure.zoomed .frame { cursor: zoom-out; }
figure img { display: block; max-width: 100%; max-height: 340px;
             background: #fff; }
figure.zoomed img { max-height: none; }
figcaption { font: 12px/1.45 var(--mono); color: var(--ink-2);
             padding: 8px 12px; border-top: 1px solid var(--rule); }
.key-red, .key-blue { font-weight: 600; }
.key-red { color: var(--red); }
.key-blue { color: var(--blue); }
.approx { color: var(--red); font-weight: 600; }

.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
         gap: 0; margin: 18px 0 22px; border: 1px solid var(--rule);
         background: var(--sheet); }
.fact { padding: 10px 14px; border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule); min-width: 0; }
.fact:nth-child(2n) { border-right: 0; }
.fact:nth-last-child(-n+2) { border-bottom: 0; }
.fact dt { font: 10px/1 var(--mono); letter-spacing: .12em;
           text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.fact dd { margin: 0; overflow-wrap: anywhere; }
.verbatim { font: 16px/1.35 var(--mono); background: var(--paper-2);
            padding: 2px 6px; white-space: pre-wrap; }
.guess { color: var(--red); }

/* ---- questions -------------------------------------------------------- */
.q { display: grid; grid-template-columns: 40px 1fr; gap: 4px 12px;
     padding: 14px 14px 16px; margin-bottom: 10px; background: var(--sheet);
     border: 1px solid var(--rule); border-left: 4px solid var(--rule); }
.q.active { border-left-color: var(--blue); }
.q.answered { border-left-color: var(--ok); }
.q.active.answered { border-left-color: var(--blue); }
.q-num { font: 600 22px/1 var(--mono); color: var(--ink-3); padding-top: 2px; }
.q.active .q-num { color: var(--blue); }
.q-prompt { font-weight: 600; font-size: 16px; }
.q-help { color: var(--ink-3); font-size: 13px; }
.opts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px;
        margin-top: 8px; }
.opt { min-height: 38px; padding: 6px 12px; border: 1.5px solid var(--rule);
       background: transparent; cursor: pointer; display: inline-flex;
       align-items: center; gap: 8px; }
.opt:hover { border-color: var(--ink-2); }
.opt .sym { font: 20px/1 var(--mono); min-width: 1.1em; text-align: center; }
.opt kbd { font: 11px/1 var(--mono); padding: 3px 5px;
           border: 1px solid var(--rule); color: var(--ink-3); }
.opt.selected { border-color: var(--blue); background: var(--blue-soft);
                box-shadow: inset 0 0 0 1px var(--blue); }
.opt.hidden { display: none; }
.filter { grid-column: 2; margin-top: 8px; height: 38px; width: min(340px, 100%);
          padding: 0 10px; border: 1.5px solid var(--rule);
          background: var(--paper-2); font-family: var(--mono); }
.note { grid-column: 2; margin-top: 8px; height: 38px; width: 100%;
        padding: 0 10px; border: 1.5px dashed var(--rule);
        background: transparent; }
.note-q .q-num { font-size: 16px; }

.nav { display: flex; justify-content: space-between; align-items: center;
       margin-top: 18px; gap: 12px; }
.nav button { min-height: 42px; padding: 0 18px; border: 1.5px solid var(--ink);
              background: transparent; cursor: pointer;
              font: 600 13px/1 var(--mono); letter-spacing: .06em; }
.nav button:disabled { opacity: .35; cursor: default; }
.hint { font: 12px/1.5 var(--mono); color: var(--ink-3); text-align: center; }
.hint kbd { border: 1px solid var(--rule); padding: 1px 5px; }

/* ---- finish summary --------------------------------------------------- */
.summary { max-width: 760px; margin: 30px auto; background: var(--sheet);
           border: 2px solid var(--ink); box-shadow: var(--shadow); }
.summary h2 { margin: 0; padding: 14px 18px; border-bottom: 2px solid var(--ink);
              font: 600 18px/1.2 var(--mono); }
.summary table { width: 100%; border-collapse: collapse; }
.summary td { padding: 9px 18px; border-bottom: 1px solid var(--rule);
              font-family: var(--mono); }
.summary td:last-child { text-align: right; font-weight: 600; }
.big { display: flex; align-items: baseline; gap: 14px; padding: 18px;
       border-bottom: 1px solid var(--rule); }
.big strong { font: 600 56px/1 var(--mono); color: var(--ok); }
.done-line { padding: 18px; font: 600 16px/1.4 var(--mono); }
.done-line .where { display: block; font-weight: 400; font-size: 12px;
                    color: var(--ink-3); margin-top: 6px; overflow-wrap: anywhere; }
.summary .nav { padding: 0 18px 18px; margin: 0; }
.fatal { max-width: 640px; margin: 60px auto; padding: 18px;
         border: 2px solid var(--red); background: var(--sheet);
         font-family: var(--mono); }

@media (max-width: 900px) {
  .titleblock { grid-template-columns: 1fr auto auto; }
  .titleblock .sheets-cell { grid-column: 1 / -1; order: 3;
                             border-top: 1px solid var(--rule); }
  .figures { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr; }
  .fact { border-right: 0; }
  .fact:nth-last-child(2) { border-bottom: 1px solid var(--rule); }
}
</style>
</head>
<body>
<header class="titleblock" id="tb"></header>
<main id="main"><p class="hint">Loading…</p></main>
<script>
"use strict";
// Every request carries the session token; the server refuses anything
// without it. Client text is only ever set through textContent.
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const withToken = (p) => p + (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN);

const S = { deck: null, answers: {}, idx: 0, active: 0, finished: null,
            zoom: {}, saving: 0, failed: false };
let saveChain = Promise.resolve();
// Crops are served no-store so client images never reach the disk cache;
// the page therefore keeps each loaded <img> and re-uses it on re-render.
const IMGS = new Map();
function cropImg(r, which) {
  const k = r.id + "/" + which;
  if (!IMGS.has(k)) IMGS.set(k, el("img", {
    src: withToken(`/crop/${r.id}/${which}.png`),
    alt: which === "clean" ? "clean drawing crop" : "stamped drawing crop" }));
  return IMGS.get(k);
}
let noteTimer = null;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) {
    if (k === null || k === undefined || k === false) continue;
    n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return n;
}

const Q = () => S.deck.questions;
const rows = () => S.deck.rows;
const row = () => rows()[S.idx];
const ans = (id) => S.answers[id] || {};
const complete = (id) => Q().every((q) => ans(id)[q.key]);
const firstOpen = (id) => { const i = Q().findIndex((q) => !ans(id)[q.key]); return i < 0 ? Q().length - 1 : i; };

// ---- saving ------------------------------------------------------------
function setStatus() {
  const s = document.getElementById("status");
  if (!s) return;
  s.className = "status" + (S.failed ? " bad" : S.saving ? "" : " good");
  s.replaceChildren(el("span", { class: "tb-label" }, "status"),
    S.failed ? "not saved — retrying" : S.saving ? "saving…" : "saved ✓");
}

function save(id, patch) {
  S.answers[id] = Object.assign({}, ans(id), patch);
  S.saving++; setStatus();
  // Serialised, so two quick clicks on the same question can never land
  // out of order and leave the older answer on disk.
  saveChain = saveChain.then(() => send(id, patch)).finally(() => {
    S.saving--; setStatus(); renderSheets();
  });
}

async function send(id, patch) {
  for (let wait = 1000; ; wait = Math.min(wait * 2, 10000)) {
    try {
      const r = await fetch(withToken("/api/answer"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, answer: patch }) });
      if (r.ok) { S.failed = false; return; }
      if (r.status === 400 || r.status === 403) {
        S.failed = true; setStatus();
        const e = await r.json().catch(() => ({}));
        alert("Not saved: " + (e.error || r.status));
        return;
      }
    } catch (_) { /* server not reachable: retry */ }
    S.failed = true; setStatus();
    await new Promise((res) => setTimeout(res, wait));
  }
}

// ---- title block -------------------------------------------------------
function renderTitle() {
  const tb = document.getElementById("tb");
  tb.replaceChildren(
    el("div", {}, el("span", { class: "tb-label" }, "review"),
       el("div", { class: "tb-title" }, "gdt ",
          el("small", {}, "· " + S.deck.run))),
    el("div", { class: "sheets-cell" },
       el("span", { class: "tb-label", id: "sheet-label" }, ""),
       el("div", { class: "sheets", id: "sheets" })),
    el("div", { class: "status", id: "status" }),
    el("button", { class: "finish", onclick: finish,
                   title: "Write the tally (counts only)" }, "Finish"));
  renderSheets(); setStatus();
}

function renderSheets() {
  const box = document.getElementById("sheets");
  if (!box) return;
  const done = rows().filter((r) => complete(r.id)).length;
  document.getElementById("sheet-label").textContent =
    `row ${S.idx + 1} of ${rows().length} · ${done} answered`;
  box.replaceChildren(...rows().map((r, i) => el("button", {
    class: "sheet-dot" + (complete(r.id) ? " done" : "") + (i === S.idx && !S.finished ? " current" : ""),
    title: `${r.id} · balloon ${r.balloon}`, "aria-label": `go to ${r.id}`,
    onclick: () => go(i) }, String(i + 1))));
}

// ---- one row -----------------------------------------------------------
function crop(r, which) {
  const approx = which === "stamped" && r.stamped_approx;
  const zoomed = !!S.zoom[which];
  const img = cropImg(r, which);
  const caption = which === "clean"
    ? el("figcaption", {}, "Clean drawing · ",
         el("span", { class: "key-red" }, "red box"), " what the pipeline read · ",
         el("span", { class: "key-blue" }, "blue dot"), " gold balloon position")
    : el("figcaption", {}, `Stamped drawing · balloon ${r.balloon} as printed`,
         approx ? el("span", { class: "approx" }, " · position approximate") : null);
  return el("figure", { class: zoomed ? "zoomed" : "" },
    el("div", { class: "frame", title: zoomed ? "click to shrink" : "click to enlarge",
                onclick: () => { S.zoom[which] = !zoomed; render(); } }, img),
    caption);
}

function fact(label, ...value) {
  return el("div", { class: "fact" }, el("dt", {}, label), el("dd", {}, ...value));
}

function question(q, qi, r) {
  const current = ans(r.id)[q.key] || "";
  const isActive = qi === S.active;
  const opts = q.options.map((o) => el("button", {
      class: "opt" + (current === o.value ? " selected" : ""),
      "data-value": o.value, title: o.help ? `${o.label} — ${o.help}` : o.label,
      "aria-pressed": current === o.value ? "true" : "false",
      onclick: (e) => { e.stopPropagation(); pick(qi, o.value); } },
    o.symbol ? el("span", { class: "sym" }, o.symbol) : null,
    el("span", {}, o.label),
    o.hotkey ? el("kbd", {}, o.hotkey.toUpperCase()) : null));
  const box = el("div", { class: "opts" }, opts);
  const filter = q.filter ? el("input", {
      class: "filter", type: "text", placeholder: "type to filter · Enter picks",
      "aria-label": "filter answers", "data-filter": "1",
      oninput: (e) => {
        const f = e.target.value.trim().toLowerCase();
        for (const b of box.children) {
          const v = b.getAttribute("data-value").toLowerCase();
          b.classList.toggle("hidden", !!f && !v.includes(f));
        }
      },
      onfocus: () => setActive(qi) }) : null;
  return el("section", {
      class: "q" + (isActive ? " active" : "") + (current ? " answered" : ""),
      onclick: () => setActive(qi) },
    el("div", { class: "q-num" }, String(qi + 1)),
    el("div", {}, el("div", { class: "q-prompt" }, q.prompt),
       q.help ? el("div", { class: "q-help" }, q.help) : null),
    filter, box);
}

function render() {
  if (S.finished) return renderSummary();
  const r = row();
  const main = document.getElementById("main");
  const note = el("input", { class: "note", type: "text", maxlength: "2000",
      placeholder: "note — only for you, never read by the tally",
      "aria-label": "note", value: ans(r.id).note || "",
      oninput: (e) => {
        S.answers[r.id] = Object.assign({}, ans(r.id), { note: e.target.value });
        clearTimeout(noteTimer);
        const v = e.target.value;
        noteTimer = setTimeout(() => save(r.id, { note: v }), 400);
      } });
  const scorer = r.scorer_reads_gold_as === "none" ? "no type word it knows" : r.scorer_reads_gold_as;
  main.replaceChildren(el("article", { class: "row" },
    el("div", { class: "meta" },
      el("span", { class: "id" }, r.id),
      el("span", { class: "part" }, `part ${r.doc_id} · balloon ${r.balloon} · ${r.where}`),
      el("span", { class: "badge " + (r.silent ? "silent" : "flagged") },
         r.silent ? "silent error today" : "flagged today")),
    el("div", { class: "figures" }, crop(r, "clean"), crop(r, "stamped")),
    el("dl", { class: "facts" },
      fact("Inspection-sheet label", el("span", { class: "verbatim" }, r.gold_label || "—")),
      fact("Reader transcribed", el("span", { class: "verbatim" }, r.transcription || "—")),
      fact("Pipeline predicted", r.predicted || "—",
           r.parser_defaulted ? el("span", { class: "guess" }, " — a guess: no GD&T symbol recognised") : null),
      fact("Scorer reads the label as", scorer)),
    Q().map((q, qi) => question(q, qi, r)),
    el("section", { class: "q note-q" }, el("div", { class: "q-num" }, "✎"),
       el("div", {}, el("div", { class: "q-prompt" }, "Note"),
          el("div", { class: "q-help" }, "Optional. Stays on this machine.")), note),
    el("div", { class: "nav" },
      el("button", { onclick: () => go(S.idx - 1), disabled: S.idx === 0 }, "← prev"),
      el("div", { class: "hint" }, "letters answer the ", el("b", {}, "blue"),
         " question · ", el("kbd", {}, "Enter"), " / ", el("kbd", {}, "→"), " next · ",
         el("kbd", {}, "←"), " back · click a crop to enlarge"),
      el("button", { onclick: () => go(S.idx + 1), disabled: S.idx === rows().length - 1 }, "next →"))));
  renderSheets();
  preload(S.idx + 1);
}

function preload(i) {
  const r = rows()[i];
  if (!r) return;
  for (const w of ["clean", "stamped"]) cropImg(r, w);
}

// ---- interaction -------------------------------------------------------
function setActive(qi) {
  if (S.active === qi) return;
  S.active = qi;
  document.querySelectorAll("section.q:not(.note-q)").forEach((s, i) => s.classList.toggle("active", i === qi));
}

function pick(qi, value) {
  const r = row(), key = Q()[qi].key;
  const next = ans(r.id)[key] === value ? "" : value;   // click again clears
  save(r.id, { [key]: next });
  S.active = next ? firstOpenAfter(r.id, qi) : qi;
  render();
}

function firstOpenAfter(id, qi) {
  for (let i = qi + 1; i < Q().length; i++) if (!ans(id)[Q()[i].key]) return i;
  const any = Q().findIndex((q) => !ans(id)[q.key]);
  return any < 0 ? qi : any;
}

function go(i) {
  if (i < 0 || i >= rows().length) return;
  S.idx = i; S.active = firstOpen(row().id); S.zoom = {};
  render(); window.scrollTo({ top: 0 });
}

document.addEventListener("keydown", (e) => {
  if (!S.deck || S.finished || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && t.matches && t.matches("input.filter")) {
    if (e.key === "Enter") {
      const first = t.parentElement.querySelector(".opt:not(.hidden)");
      if (first) { e.preventDefault(); pick(S.active, first.getAttribute("data-value")); }
    } else if (e.key === "Escape") { t.value = ""; t.dispatchEvent(new Event("input")); t.blur(); }
    return;
  }
  if (t && t.matches && t.matches("input.note")) {
    if (e.key === "Enter") { e.preventDefault(); t.blur(); go(S.idx + 1); }
    else if (e.key === "Escape") t.blur();
    return;
  }
  if (e.key === "Enter" && t && t.tagName === "BUTTON") return;
  if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); go(S.idx + 1); return; }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(S.idx - 1); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); S.active = Math.min(S.active + 1, Q().length - 1); render(); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); S.active = Math.max(S.active - 1, 0); render(); return; }
  if (e.key.length !== 1) return;
  const q = Q()[S.active];
  const hit = q.options.find((o) => o.hotkey && o.hotkey === e.key.toLowerCase());
  if (hit) { e.preventDefault(); pick(S.active, hit.value); return; }
  if (q.filter && /\S/.test(e.key)) {
    // Typing on the filtered question starts the filter with that letter.
    const f = document.querySelector("input.filter");
    if (f) { e.preventDefault(); f.focus(); f.value = e.key; f.dispatchEvent(new Event("input")); }
  }
});

// ---- finish ------------------------------------------------------------
async function finish() {
  const open = rows().filter((r) => !complete(r.id)).length;
  if (open && !confirm(`${open} row${open === 1 ? "" : "s"} unanswered — finish anyway?\n\nThey are reported as unanswered, never guessed.`)) return;
  await saveChain;
  try {
    const r = await fetch(withToken("/api/finish"), { method: "POST",
      headers: { "Content-Type": "application/json" }, body: "{}" });
    const body = await r.json();
    if (!r.ok) { alert("Could not finish: " + (body.error || r.status)); return; }
    S.finished = body; renderSheets(); render(); window.scrollTo({ top: 0 });
  } catch (_) { alert("Could not reach the review server. Is it still running?"); }
}

function renderSummary() {
  const t = S.finished.tally;
  const line = (label, n) => el("tr", {}, el("td", {}, label), el("td", {}, String(n)));
  const group = (title, obj) => Object.keys(obj).length
    ? [el("tr", {}, el("td", { colspan: "2" }, el("span", { class: "tb-label" }, title))),
       ...Object.entries(obj).map(([k, v]) => line(k.replaceAll("_", " "), v))] : [];
  document.getElementById("main").replaceChildren(el("section", { class: "summary row" },
    el("h2", {}, "Review finished"),
    el("div", { class: "big" }, el("strong", {}, String(t.freed_without_gpu)),
       el("span", {}, "rows fixable without a GPU")),
    el("table", {},
      line("answered", `${t.answered} of ${t.n_rows}`),
      t.incomplete.length ? line("unanswered", t.incomplete.join(", ")) : null,
      t.invalid.length ? line("invalid", t.invalid.join(", ")) : null,
      group("where the prediction's fix lives", t.prediction_fix),
      group("gold side", t.gold_side),
      group("what the drawings show", t.drawing_shows)),
    el("div", { class: "done-line" }, "Done — tell the agent: done",
       el("span", { class: "where" }, "counts written to " + S.finished.written_to)),
    el("div", { class: "nav" },
       el("button", { onclick: () => { S.finished = null; render(); } }, "← back to the rows"),
       el("span", {}))));
}

// ---- start -------------------------------------------------------------
(async () => {
  try {
    const r = await fetch(withToken("/api/deck"));
    if (!r.ok) throw new Error(r.status === 403 ? "This link has no valid session token. Use the exact link review-serve printed." : "HTTP " + r.status);
    S.deck = await r.json();
    S.answers = S.deck.answers || {};
    if (!rows().length) {
      document.getElementById("main").replaceChildren(el("div", { class: "fatal" }, "This deck has no rows to review."));
      return;
    }
    const open = rows().findIndex((x) => !complete(x.id));
    S.idx = open < 0 ? 0 : open;
    S.active = firstOpen(row().id);
    renderTitle(); render();
  } catch (e) {
    document.getElementById("main").replaceChildren(el("div", { class: "fatal" }, "Could not load the review: " + e.message));
  }
})();
</script>
